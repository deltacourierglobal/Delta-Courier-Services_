<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delta Courier - Track Shipment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef2f7, #f9fbff);
  min-height: 100vh;
}

/* ===== HEADER ===== */
.track-header {
  text-align: center;
  margin-top: 30px;
}

.track-header img {
  display: block;
  margin: auto;
}

.page-title {
  text-align: center;
  margin: 20px 0 30px;
  color: #0a1f44;
  font-size: 32px;
}

/* ===== MAIN CONTAINER ===== */
.tracking-container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 40px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  animation: fadeIn 0.6s ease;
}

/* ===== DELIVERY BOX ===== */
.delivery-box {
  background: #f8f9fc;
  padding: 25px;
  border-radius: 10px;
  margin-bottom: 25px;
  border-left: 6px solid #0a1f44;
}

/* ===== STATUS BADGE ===== */
.status-badge {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  color: #fff;
  display: inline-block;
  margin-top: 10px;
}

/* ===== ROUTE ===== */
.route-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 30px 0;
}

.route-line {
  flex: 1;
  height: 6px;
  background: #ddd;
  margin: 0 10px;
  position: relative;
  border-radius: 10px;
}

.route-progress {
  height: 100%;
  background: #0d6efd;
  width: 40%;
  border-radius: 10px;
}

.truck {
  position: absolute;
  top: -12px;
  left: 40%;
  font-size: 20px;
}

/* ===== MAP ===== */
#map {
  height: 350px;
  border-radius: 10px;
  margin-top: 25px;
}

/* ===== PROGRESS STEPS ===== */
.progress-container {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
}

.progress-step {
  text-align: center;
  flex: 1;
}

.circle {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #ddd;
  margin: auto;
  line-height: 30px;
}

.active .circle {
  background: #0d6efd;
  color: #fff;
}

/* =========================
   TIMELINE ROOT
========================= */
#timeline {
  position: relative;
  margin-top: 25px;
  padding-left: 30px;
}

/* vertical line */
#timeline::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(to bottom, #0a1f44, #1e90ff);
  opacity: 0.3;
}

/* =========================
   ITEM CARD
========================= */
.timeline-item {
  position: relative;
  margin-bottom: 20px;
  padding: 14px 16px 14px 20px;
  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  animation: fadeInUp 0.4s ease forwards;
}

/* =========================
   DOT
========================= */
.timeline-dot {
  position: absolute;
  left: -20px;
  top: 18px;
  width: 12px;
  height: 12px;
  background: #1e90ff;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px rgba(30,144,255,0.2);
}

/* =========================
   CONTENT LAYOUT FIX
========================= */
.timeline-content {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 🔥 STATUS ROW (FIXES BADGE BREAK) */
.timeline-status {
  font-weight: 600;
  font-size: 14px;
  color: #0a1f44;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* OPTIONAL STATUS BADGE */
.timeline-status span {
  background: #1e90ff;
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
}

/* location */
.timeline-location {
  font-size: 13px;
  color: #666;
}

/* date */
.timeline-date {
  font-size: 12px;
  color: #999;
}

/* =========================
   NEW ITEM ANIMATION
========================= */
.timeline-item.new {
  border-left: 3px solid #1e90ff;
  animation: popIn 0.5s ease, glowPulse 1.5s ease-in-out 2;
}

.timeline-item.new .timeline-dot {
  background: #ff3b3b;
}

#etaBox {
  background: #0a1f44;
  color: #fff;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: 500;
  margin-bottom: 15px;
  text-align: center;
}

.truck {
  transition: left 0.8s ease, transform 0.3s ease;
}

.footer{
background:#063474;
padding:50px 20px 30px;
margin-top:50px;
text-align:center;
}

.footer-container{
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap;
margin-bottom:30px;
}

.footer-col{
min-width:150px;
}

.footer-col h4{
margin-bottom:12px;
font-size:15px;
}

.footer-col a{
display:block;
text-decoration:none;
color:#cbd5e1;
font-size:14px;
margin:6px 0;
transition:0.3s;
}

.footer-col a:hover{
color:#1e88ff;
padding-left:5px;
}

/* Socials */
.footer-socials{
margin:20px 0;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.footer-socials .social-link {

  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#132b52;
  color:white;
  transition:0.3s;
}

.footer-socials .social-link:hover {
  background:#1e88ff;
  transform:translateY(-3px);
}

/* Logo center */
.footer-logo img{
width:110px;
margin:20px auto;
display:block;
}

/* Copyright */
.footer-copy{
font-size:13px;
color:#94a3b8;
margin-top:10px;
}

#routeTruck {
  display: inline-block;
  transform: scaleX(-1);
}

/* animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes glowPulse {
  0% { box-shadow: 0 0 0 rgba(30,144,255,0); }
  50% { box-shadow: 0 0 18px rgba(30,144,255,0.35); }
  100% { box-shadow: 0 0 0 rgba(30,144,255,0); }
}

@keyframes moveBounce {
  from { transform: translateY(0); }
  to { transform: translateY(-5px); }
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px) {
  .tracking-container { padding: 25px; }
  .page-title { font-size: 26px; }
}
</style>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBxNfOGRptsXdSijEekyAeLmnHFdZgDAfY"></script>

<script>
const API_BASE = "https://delta-courier-services-production-5a20.up.railway.app";

const params = new URLSearchParams(window.location.search);
const trackingNumber =
  params.get("trackingNumber")?.trim();

const shipmentDetails = document.getElementById("shipmentDetails");
const timelineEl = document.getElementById("timeline");


let countdownInterval = null;

let floatingInterval = null;
let animationInterval = null;

// ================= DATE FORMAT (FIXED GLOBAL) =================
function formatDate(dateString) {
  const d = new Date(dateString);
  if (isNaN(d)) return "-";
  return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
}

// ================= COUNTDOWN =================
function updateCountdown(deliveryDate) {
  const el = document.getElementById("countdown");
  if (!el) return;

  if (countdownInterval) clearInterval(countdownInterval);

  if (!deliveryDate) {
    el.innerText = "No delivery date";
    return;
  }

  const delivery = new Date(deliveryDate);
  if (isNaN(delivery.getTime())) {
    el.innerText = "Invalid date";
    return;
  }

  function tick() {
    const now = new Date();
    const diff = delivery - now;

    if (diff <= 0) {
      el.innerText = "Delivered";
      clearInterval(countdownInterval);
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);

    el.textContent = `${d}d ${h}h ${m}m remaining`;
  }

  tick();
  countdownInterval = setInterval(tick, 60000);
}

//=====CREATE MAP======//
let map, marker;
let moveInterval = null;
let floatInterval = null;

function createMap(lat, lng, mode) {
  const position = {
    lat: Number(lat) || 6.5244,
    lng: Number(lng) || 3.3792
  };

  // icons
  let icon = "";

  if (mode === "plane") {

    icon =
      "https://maps.google.com/mapfiles/kml/shapes/airports.png";

  } else if (mode === "ship") {

    icon =
      "https://maps.google.com/mapfiles/kml/shapes/ferry.png";

  } else if (mode === "hub") {

    icon =
      "https://maps.google.com/mapfiles/kml/shapes/info-i_maps.png";

  } else {

    icon =
      "https://maps.google.com/mapfiles/ms/icons/truck.png";

  }

  // create map once
  if (!map) {
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 14, // zoom in — you need 12-15 to see live movement
      center: position,
      mapTypeControl: false,
      streetViewControl: false,
    });
    marker = new google.maps.Marker({ position, map, icon });
    startFloating(); // start wiggle once
    return;
  }

  // update icon
  marker.setIcon(icon);
  map.panTo(position);

  // ---- smooth move ----
  if (moveInterval) clearInterval(moveInterval);

  const start = marker.getPosition();
  const startLat = start.lat();
  const startLng = start.lng();
  const steps = 60; // ~1.2 seconds at 20ms
  let i = 0;

  moveInterval = setInterval(() => {
    i++;
    const lat = startLat + (position.lat - startLat) * (i / steps);
    const lng = startLng + (position.lng - startLng) * (i / steps);
    marker.setPosition({ lat, lng });

    if (i >= steps) {
      clearInterval(moveInterval);
      moveInterval = null;
    }
  }, 20);
}

function startFloating() {
  if (floatInterval) return; // only once
  let dir = 1;
  floatInterval = setInterval(() => {
    if (!marker || moveInterval) return; // don't wiggle while moving
    const pos = marker.getPosition();
    marker.setPosition({
      lat: pos.lat() + 0.00005 * dir,
      lng: pos.lng() + 0.00005 * dir
    });
    dir *= -1;
  }, 800);
}

/// ================= ROUTE =================
let lastPercent = 0; // ✅ MUST be OUTSIDE

function updateRoute(status) {
  const progress = document.getElementById("routeProgress");
  const truck = document.getElementById("routeTruck");

  if (!progress || !truck) return;

  let percent = 0;
  const s = (status || "").toLowerCase();

  if (s.includes("registered")) percent = 5;
  else if (s.includes("picked")) percent = 25;
  else if (s.includes("transit")) percent = 60;
  else if (s.includes("out")) percent = 85;
  else if (s.includes("delivered")) percent = 100;

  progress.style.width = percent + "%";
  truck.style.left = percent + "%";

  // 🔥 direction control
  if (percent >= lastPercent) {
truck.style.direction = "ltr"; 
  } else {
    truck.style.transform = "translateX(-50%) scaleX(-1)";
  }

  lastPercent = percent;
}

// ================= TRANSPORT =================
function setTransportIcon(mode) {
  const truck = document.getElementById("routeTruck");
  if (!truck) return;

  const m = (mode || "").toLowerCase();

  if (m.includes("plane") || m.includes("air")) {
    truck.innerHTML = "✈️";
  } else if (m.includes("ship") || m.includes("sea")) {
    truck.innerHTML = "🚢";
  } else {
    truck.innerHTML = "🚚";
  }

  truck.style.transition = "left 0.6s ease";
}

// ================= STATUS =================
function getStatusIcon(status, isDelayed) {
  if (!status) return "📦";
  if (isDelayed) return "🔴";

  const s = status.toLowerCase();

  if (s.includes("delivered")) return "🟢";
  if (s.includes("transit")) return "🔵";
  if (s.includes("registered")) return "🟠";

  return "📍";
}

// ================= LOAD =================
async function loadShipment() {
  if (!trackingNumber) {
    document.getElementById("error").innerText = "No tracking number";
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/shipments/${trackingNumber}`);
    const data = await res.json();

    if (!data) return;


console.log("FULL DATA:", data);
console.log("Transport:", data.transportMode);
    updateRoute(data.currentStatus);
    setTransportIcon(data.transportMode);
    updateCountdown(data.deliveryDate);
    createMap(
  data.lat,
  data.lng,
  data.transportMode,
  data.origin,
  data.destination
);

    shipmentDetails.innerHTML = `
  <h3>${data.trackingNumber || "-"}</h3>
  <p><strong>Receiver:</strong> ${data.receiver || "-"}</p>
  <p><strong>Origin:</strong> ${data.origin || "-"}</p>
  <p><strong>Destination:</strong> ${data.destination || "-"}</p>
  <p><strong>Weight:</strong> ${data.weight || "-"} kg</p>
  <p><strong>Status:</strong> ${data.currentStatus || "-"}</p>
`;

const etaBox = document.getElementById("etaBox");
if (etaBox) {
  etaBox.innerText = "Estimated Delivery: " + formatDate(data.deliveryDate);
}


    // DELAY
    const delayBox = document.getElementById("delayBox");
    const delayReasonText = document.getElementById("delayReasonText");

    if (data.isDelayed) {
      delayBox.style.display = "block";
      delayReasonText.innerText = data.delayReason || "No reason provided";
    } else {
      delayBox.style.display = "none";
    }

    // TIMELINE FIX
    timelineEl.innerHTML = "";

    if (Array.isArray(data.history)) {
      data.history.slice().reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "timeline-item";

div.innerHTML = `
  <div class="timeline-dot"></div>
  <div class="timeline-content">
    <div class="timeline-status">
      ${getStatusIcon(item.status, data.isDelayed)} ${item.status}
      <span>${item.location}</span>
    </div>
    <div class="timeline-date">${formatDate(item.date)}</div>
  </div>
`;
        timelineEl.appendChild(div);
      });
    }

  } catch (err) {
    document.getElementById("error").innerText = "Failed to load shipment";
    console.error(err);
  }
}

// ================= START =================
window.onload = loadShipment;
</script>
