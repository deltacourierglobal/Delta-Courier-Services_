<!DOCTYPE html>
<html>
<head>
<title>Delta Courier Admin Login</title>
<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
width:300px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#ff6b00;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#ff4500;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="password" id="password" placeholder="Enter Admin Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>

function login(){

const password=document.getElementById("password").value;

if(password==="admin123"){

localStorage.setItem("adminAuth","true");
window.location.href="admin.html";

}else{

document.getElementById("msg").innerText="Wrong password";

}

}

</script>

</body>
</html>
