<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delta Courier Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#0a1f44;
color:white;
padding:20px;
text-align:center;
position:relative;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.dashboard-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h2{
margin-bottom:20px;
}

input,
select,
textarea{

width:100%;
padding:12px 14px;
margin-bottom:14px;

border-radius:8px;
border:1px solid #d6dbe3;

font-size:15px;
font-family:Arial, sans-serif;

background:#fff;

box-sizing:border-box;

transition:0.3s ease;

}

/* FOCUS EFFECT */

input:focus,
select:focus,
textarea:focus{

outline:none;
border-color:#1e88ff;

box-shadow:0 0 0 4px rgba(30,136,255,0.12);

}

/* TEXTAREA */

textarea{

min-height:140px;
resize:vertical;
line-height:1.6;

}

button{
background:#ff6b00;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
width:100%;
}

button:hover{
background:#ff4500;
}

.success{
color:green;
margin-top:10px;
}

.error{
color:red;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

td button{
width:auto;
padding:8px 12px;
margin-right:6px;
margin-bottom:5px;
font-size:13px;
}

th{
background:#f4f6f9;
}

tr:hover{
background:#fafafa;
}

.logout{
position:absolute;
right:20px;
top:20px;
background:#ff6b00;
width:auto;
padding:8px 14px;
}

@media print {
  body * {
    visibility: hidden;
  }

  #invoice, #invoice * {
    visibility: visible;
  }

  #invoice {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }

  .print-btn {
    display: none;
  }
}
td button{
display:inline-block !important;
visibility:visible !important;
opacity:1 !important;
}

/* ================= MOBILE RESPONSIVE ================= */

@media(max-width:768px){

body{
padding:10px;
overflow-x:hidden;
}

/* containers */

.container,
.dashboard,
.admin-container,
.panel{
width:100%;
padding:10px;
box-sizing:border-box;
}

/* forms */

input,
select,
textarea,
button{
width:100%;
font-size:16px;
margin-bottom:12px;
box-sizing:border-box;
}

/* buttons */

button{
padding:14px;
}

/* tables */

table{
display:block;
overflow-x:auto;
white-space:nowrap;
width:100%;
}

/* cards */

.card{
width:100%;
margin-bottom:15px;
}

/* map */

#map{
height:300px !important;
width:100% !important;
}

/* shipment controls */

.actions,
.controls,
.form-row{
display:flex;
flex-direction:column;
gap:10px;
}

/* prevent overflow */

img{
max-width:100%;
height:auto;
}

}

.admin-support{
margin-top:40px;
background:white;
padding:25px;
border-radius:12px;
}

.ticket-card{
border:1px solid #ddd;
padding:20px;
margin-bottom:20px;
border-radius:10px;
background:#fafafa;
}

.ticket-card h3{
margin-bottom:10px;
}

.ticket-card p{
margin:6px 0;
}

.reply-box{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:8px;
min-height:100px;
}

.reply-btn{
margin-top:12px;
padding:12px 20px;
border:none;
background:#1d4d8f;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>
</head>
<body>

<script>

document.addEventListener("DOMContentLoaded", function () {

const API_BASE =
"https://delta-courier-services-production-5a20.up.railway.app";


if(localStorage.getItem("adminAuth")!=="true"){
   window.location.href="admin-login.html";
}

// CREATE MAP //

let map = null;
let marker = null;

let moveInterval = null;
let floatInterval = null;


// ICONS (MOVE OUTSIDE createMap)
const icons = {

  plane:"https://maps.google.com/mapfiles/kml/shapes/airports.png",

  ship:"https://maps.google.com/mapfiles/kml/shapes/ferry.png",

  hub:"https://maps.google.com/mapfiles/kml/shapes/info-i_maps.png",

  truck:"https://maps.google.com/mapfiles/ms/icons/truck.png"

};


function createMap(lat, lng, mode) {

  const latNum = Number(lat);
  const lngNum = Number(lng);

  const position =

    (!isNaN(latNum) && !isNaN(lngNum))

    ? { lat:latNum, lng:lngNum }

    :{ lat:25.2048, lng:55.2708 } ;


  // GET ICON FIRST
  const icon =
  icons[mode] || icons.truck;


  // CREATE MAP ONCE
  if(!map){

    map = new google.maps.Map(

      document.getElementById("map"),

      {

        zoom:14,

        center:position,

        mapTypeControl:false,

        streetViewControl:false

      }

    );


    marker = new google.maps.Marker({

      position:position,

      map:map,

      icon:icon,

      draggable:true

    });


    // DRAG EVENT
    marker.addListener("dragend", function(){

      const pos = marker.getPosition();

      document.getElementById("lat").value =
      pos.lat();

      document.getElementById("lng").value =
      pos.lng();

    });


    startFloating();

    return;

  }


  // UPDATE ICON
  marker.setIcon(icon);

  map.panTo(position);


  // STOP OLD MOVEMENT
  if(moveInterval){

    clearInterval(moveInterval);

  }


  const start = marker.getPosition();

  const startLat = start.lat();

  const startLng = start.lng();

  let i = 0;

  const steps = 60;


  moveInterval = setInterval(()=>{

    i++;

    const lat =

    startLat +

    ((position.lat - startLat)

    * (i / steps));


    const lng =

    startLng +

    ((position.lng - startLng)

    * (i / steps));


    marker.setPosition({

      lat,

      lng

    });


    if(i >= steps){

      clearInterval(moveInterval);

      moveInterval = null;

    }

  },20);

}


function startFloating(){

  if(floatInterval) return;

  let dir = 1;

  floatInterval = setInterval(()=>{

    if(!marker || moveInterval) return;

    const pos = marker.getPosition();

    marker.setPosition({

      lat: pos.lat() + (0.00005 * dir),

      lng: pos.lng() + (0.00005 * dir)

    });

    dir *= -1;

  },800);

}
// ================= LOAD SHIPMENTS =================

window.loadShipments=function(){

fetch(`${API_BASE}/api/shipments`)
.then(res=>res.json())

.then(data=>{

const body=
document.getElementById("shipmentBody");

body.innerHTML="";

data.forEach(ship=>{

const row=document.createElement("tr");

row.innerHTML=`

<td>${ship.trackingNumber}</td>
<td>${ship.receiver}</td>
<td>${ship.origin}</td>
<td>${ship.destination}</td>
<td>${ship.currentStatus}</td>

<td>

<button onclick="printInvoice('${ship.trackingNumber}')">
Print
</button>

<button onclick="deleteShipment('${ship.trackingNumber}')">
Delete
</button>

</td>
`;

body.appendChild(row);

});

});

};


window.createShipment = function () {

const data = {

sender:
document.getElementById("senderName").value,

senderEmail:
document.getElementById("senderEmail").value,

senderPhone:
document.getElementById("senderPhone").value,

receiver:
document.getElementById("receiver").value,

origin:
document.getElementById("origin").value,

destination:
document.getElementById("destination").value,

weight:
document.getElementById("weight").value,

email:
document.getElementById("email").value,

phone:
document.getElementById("phone").value,

shipmentDesc:
document.getElementById("shipmentDesc").value,

shippingFee:
document.getElementById("shippingFee").value,

insuranceFee:
document.getElementById("insuranceFee").value,

taxFee:
document.getElementById("taxFee").value,

total:
document.getElementById("totalAmount").value,

deliveryType:
document.getElementById("deliveryType").value,

transportMode:
document.getElementById("transportMode").value,

currentStatus:
"Shipment Registered",

history:[
{
status:"Shipment Registered",
location:"Origin Facility",
date:new Date().toLocaleString()
}
]

};

const delivery =
document.getElementById(
"deliveryDateInput"
).value;

if(delivery){

data.deliveryDate =
new Date(delivery).toISOString();

}

fetch(`${API_BASE}/api/shipments`, {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

.then(res => res.json())

.then(result => {

console.log(result);

if(result.success){

document.getElementById(
"createMsg"
).innerHTML =
`<p class='success'>
Shipment Created:
${result.trackingNumber}
</p>`;

loadShipments();

}else{

document.getElementById(
"createMsg"
).innerHTML =
`<p class='error'>
${result.error || "Create failed"}
</p>`;

}

})

.catch(err => {

console.log("CREATE ERROR:", err);

});

};


//===ADMIN=DASHBOARD=SCRIPT==//
async function loadTickets(){

const response = await fetch("/api/support");

const tickets = await response.json();

const container =
document.getElementById("ticketContainer");

container.innerHTML = "";

tickets.forEach(ticket=>{

container.innerHTML += `

<div class="ticket-card">

<h3>${ticket.ticketId}</h3>

<p><strong>Name:</strong> ${ticket.name}</p>

<p><strong>Email:</strong> ${ticket.email}</p>

<p><strong>Tracking:</strong> ${ticket.tracking}</p>

<p><strong>Category:</strong> ${ticket.category}</p>

<p><strong>Message:</strong> ${ticket.message}</p>

<p><strong>Status:</strong> ${ticket.status}</p>

<textarea
class="reply-box"
id="reply-${ticket._id}"
placeholder="Write admin response..."
>${ticket.adminReply || ""}</textarea>

<button
class="reply-btn"
onclick="sendReply('${ticket._id}')">

Send Reply

</button>

</div>

`;

});

}

loadTickets();

//====ADMIN=DASHBOARD=FUNCTION====//

async function sendReply(id){

const reply =
document.getElementById(`reply-${id}`).value;

await fetch(`/api/support/${id}/reply`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
adminReply:reply
})

});

alert("Reply sent");

loadTickets();

}

// ================= UPDATE =================

window.updateShipment = function(){
  const tracking = document.getElementById("trackNum").value.trim();
  if(!tracking) return alert("Enter tracking");

  const payload = { password: "admin123" }; // must match ADMIN_PASSWORD

  const status = document.getElementById("status").value;
  if(status) payload.currentStatus = status;

  payload.transportMode = document.getElementById("updateTransportMode").value;
  payload.isDelayed = document.getElementById("isDelayed").checked;
  payload.delayReason = document.getElementById("delayReason").value;
  payload.customerMessage = document.getElementById("customerMessage").value;

  const latVal = document.getElementById("lat").value;
  const lngVal = document.getElementById("lng").value;
  if(latVal) payload.lat = Number(latVal);
  if(lngVal) payload.lng = Number(lngVal);

  const location = document.getElementById("location").value;
  if(status || location){
    payload.historyItem = {
      status: status || "Updated",
      location: location || "Admin Update",
      date: new Date().toLocaleString()
    };
  }


  //======NEW==CLIENTT==INFO==UPDATE===//

payload.receiver =
document.getElementById(
"updateReceiver"
).value;

payload.email =
document.getElementById(
"updateEmail"
).value;

payload.phone =
document.getElementById(
"updatePhone"
).value;

payload.destination =
document.getElementById(
"updateDestination"
).value;

  const delivery = document.getElementById("updateDeliveryDate").value;
  if(delivery) payload.deliveryDate = new Date(delivery).toISOString();

  console.log("SENDING:", payload); // check this in console

  fetch(`${API_BASE}/api/shipments/${tracking}`, {
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  })
  .then(async res => {
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || res.status);
    return data;
  })
  .then(result => {
    document.getElementById("updateMsg").innerHTML = "<p class='success'>Shipment Updated</p>";
    loadShipments();
  })
  .catch(err => {
    console.log("UPDATE ERROR:", err);
    document.getElementById("updateMsg").innerHTML = `<p class='error'>${err.message}</p>`;
  });
};


// ================= PRINT =================

window.printInvoice=function(tracking){

window.open(

`invoice.html?trackingNumber=${tracking}`,

"_blank"

);

};


// ================= OPEN INVOICE =================

window.openInvoice=function(){

const tracking=

document.getElementById(
"invoiceTracking"
).value.trim();

if(!tracking){

alert("Enter tracking number");

return;

}

printInvoice(tracking);

};


// ================= DELETE =================

window.deleteShipment=function(tracking){

if(!confirm(
"Delete shipment?"
)) return;


fetch(
`${API_BASE}/api/shipments/${tracking}`,
{
method:"DELETE"
})

.then(()=>{

loadShipments();

});

};

// move OUTSIDE DOMContentLoaded
window.initMap = function () {

  if(typeof createMap === "function"){

    createMap(
      25.2048,
      55.2708,
      "hub"
    );

  }

};

  document.getElementById(
"updateTransportMode"
).addEventListener("change", function(){

    if(marker){

        marker.setIcon(
          icons[this.value] || icons.truck
        );

    }

});
// START
loadShipments();
});

</script>

<script>

<script>

fetch("/api/stats")

.then(res => res.json())

.then(stats => {

animateCounter(
"deliveredCount",
stats.delivered
);

animateCounter(
"activeCount",
stats.active
);

animateCounter(
"countryCount",
stats.countries
);

animateCounter(
"clientCount",
stats.clients
);

});

function animateCounter(id,target){

let count = 0;

const element =
document.getElementById(id);

const speed = target / 100;

const update = () => {

count += speed;

if(count < target){

element.innerText =
Math.floor(count);

requestAnimationFrame(update);

}else{

element.innerText = target;

}

};

update();

}

</script>
